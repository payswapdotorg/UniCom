version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false
  - id: commerce
    roots: [packages/commerce/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/commerce/src/contract.ts]
    layers: { domain: domain, projection: projection, runtime: runtime }
    layerOrder: [domain, projection, runtime]
    owner: commerce-truth
  - id: agent
    roots: [packages/agent/src]
    managed: true
    requires: []
    publicEntrypoints:
      [packages/agent/src/index.ts, packages/agent/src/contract.ts, packages/agent/src/capability/index.ts]
    owner: worker-2
  - id: experience
    roots: [packages/experience/src]
    managed: true
    requires: [agent]
    publicEntrypoints: [packages/experience/src/contract.ts, packages/experience/src/runtime/index.ts]
    owner: worker-3

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions:
  - rule: max-file-lines
    paths:
      - packages/commerce/src/test/projection/support/fuzz.ts
    reason: >-
      Exhaustive fuzz vocabulary over the whole kernel command surface
      (test-support enumeration; same nature as the lint policy's test-tree
      exemption — see .oxlintrc.json overrides). Scoped to this single file.

  # TL battery (W2-008, 2026-10-08): the two central agent contract files
  # accrete ADDITIVE typed fields + one dispatch block per work wave (the
  # W2-007 pattern: new types live in their own files — intent-w2-007.ts,
  # intent-w2-008.ts, opportunity-engine-w2-00{7,8}.ts — while the central
  # surface only re-exports and dispatches). Splitting the central frozen
  # contract surface would fragment the one-contract-surface rule. Waiver
  # scoped to exactly these two files, re-evaluated if a file exceeds ~430.
  - rule: max-file-lines
    paths:
      - packages/agent/src/intent.ts
      - packages/agent/src/opportunity-engine.ts
    reason: >-
      Central buyer-intent/opportunity contract surfaces that accrete
      additive fields + a delegation block per work wave (W2-007 pattern);
      all new types live in per-wave files and are re-exported from here
      (one contract surface). Splitting would fragment the frozen
      contract; growth is additive-only and architecture-reviewed per
      merge.
